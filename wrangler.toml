name = "melon-api"
main = "src/index.ts"
compatibility_date = "2026-06-22"
workers_dev = false

[vars]
BANGUMI_API_BASE = "https://api.bgm.tv"
BANGUMI_WEB_BASE = "https://bangumi.tv"
BANGUMI_DATA_SOURCE = "https://cdn.jsdelivr.net/npm/bangumi-data@0.3/dist/data.json"
BANGUMI_USER_AGENT = "melon-api"
PUBLIC_BASE_URL = "https://melonapi.konataizumi.com"

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "melon-api-cache"

# MelonBanG's own danmaku. Schema in migrations/; apply with
# wrangler d1 migrations apply melon-api --remote
[[d1_databases]]
binding = "DB"
database_name = "melon-api"
database_id = "e0adc26e-1540-4cc6-9cc9-d66887317897"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

[[routes]]
pattern = "melonapi.konataizumi.com"
custom_domain = true

[triggers]
crons = ["0 16 * * *"]
